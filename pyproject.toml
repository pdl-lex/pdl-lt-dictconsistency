[project]
name = "pdl-ltlabtools-dictconsistency"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=23",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Kein Paket-Install (kein [build-system]) — Projektwurzel für den Import von
# pdl_lt_dictconsistency explizit auf den sys.path setzen.
pythonpath = ["."]
testpaths = ["tests"]
